      <text x="60" y="142" font-size="66" font-weight="800" fill="#e6edf3">Curso de <tspan fill="#3fb950" filter="url(#neon)">GitHub</tspan></text>
      <text x="62" y="186" font-size="28" fill="#e3c26b">do zero ao seu portfólio</text>
    </g>

