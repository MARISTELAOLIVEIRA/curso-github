<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Curso de GitHub: do zero ao portfólio · Profa. Maristela · Senac DF</title>
  <desc id="descricao">Banner no tema escuro do GitHub: o título do curso, um gráfico de contribuições que fica mais verde da esquerda para a direita e um terminal com git add, git commit e git push até o site no ar.</desc>

  <defs>
    <!-- Brilhos do fundo: verde do GitHub no alto à direita, roxo embaixo à esquerda (como no site) -->
    <radialGradient id="brilhoVerde" cx="92%" cy="-5%" r="70%">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".30"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoRoxo" cx="5%" cy="110%" r="60%">
      <stop offset="0" stop-color="#a371f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="borrado"/>
      <feMerge><feMergeNode in="borrado"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cantos"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#cantos)">
    <!-- Fundo -->
    <rect width="1200" height="360" fill="#0d1117"/>
    <rect width="1200" height="360" fill="url(#brilhoVerde)"/>
    <rect width="1200" height="360" fill="url(#brilhoRoxo)"/>

