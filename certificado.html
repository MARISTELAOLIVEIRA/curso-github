<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado · GitHub na Prática</title>
  <meta name="description" content="Certificado de conclusão dos cursos práticos de GitHub da Profª Maristela Oliveira, na Faculdade de Tecnologia e Inovação Senac DF. Verificado no GitHub.">
  <!-- prévia quando o link é compartilhado no LinkedIn (o LinkedIn não roda JavaScript, então a imagem é fixa) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Certificado · GitHub na Prática">
  <meta property="og:description" content="Concluí um curso prático de GitHub com correção automática, da Profª Maristela Oliveira na Faculdade de Tecnologia e Inovação Senac DF.">
  <meta property="og:image" content="https://maristelaoliveira.github.io/curso-github/assets/certificado-og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <!--
    CERTIFICADOS DOS CURSOS PRÁTICOS
      certificado.html                               página "Meus certificados" (o aluno digita o usuário)
      certificado.html?aluno=maria-silva&curso=entrega   um certificado (entrega, vscode, equipe ou trilha)

    COMO A VERIFICAÇÃO FUNCIONA: a página procura, na busca pública do GitHub, a issue do
    curso no repositório do aluno, aberta pelo robô e fechada com a etiqueta "concluido".
    Por isso ninguém consegue "inventar" um certificado só trocando o nome no endereço.

    PARA EDITAR: o bloco CONFIG e a lista CURSOS, no <script> lá embaixo.
  -->
  <style>
    :root {
      --bg: #0b1016; --painel: #141c27; --borda: rgba(140,170,200,.16); --texto: #e6edf3; --suave: #9aa8b8;
      --verde: #3fb950; --verde-claro: #7ee2b8; --verde-escuro: #1a7f37; --dourado: #c9a227; --azul-senac: #1d4f91;
      --sans: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); color: var(--texto); min-height: 100vh;
      background: radial-gradient(1000px 600px at 90% -10%, rgba(63,185,80,.16), transparent 60%),
                  radial-gradient(800px 600px at 0% 110%, rgba(163,113,247,.12), transparent 60%), var(--bg);
      padding: clamp(16px, 4vw, 48px);
    }
    a { color: var(--verde-claro); }
    .topo { display: flex; align-items: center; gap: 14px; max-width: 1100px; margin: 0 auto 22px; }
    .topo img { width: 44px; }
    .topo b { font-size: 18px; }
    .topo a { margin-left: auto; font-size: 14px; }
    main { max-width: 1100px; margin: 0 auto; }
    #confete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

    /* ---------- faixa de status (verificando / verificado / não encontrado) ---------- */
    .status { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 12px; margin-bottom: 18px; font-size: 15px; border: 1px solid var(--borda); background: var(--painel); }
    .status.ok { border-color: rgba(63,185,80,.55); background: rgba(63,185,80,.1); }
    .status.erro { border-color: rgba(242,184,75,.55); background: rgba(242,184,75,.08); }
    .girando { display: inline-block; animation: girar 1s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* ---------- o certificado (fundo claro, como papel) ---------- */
    .cert-moldura { overflow-x: auto; padding-bottom: 6px; }
    .cert {
      position: relative; width: 1000px; aspect-ratio: 1.414; margin: 0 auto; color: #1f2937;
      background:
        radial-gradient(600px 300px at 100% 0%, rgba(126,226,184,.22), transparent 70%),
        radial-gradient(500px 300px at 0% 100%, rgba(201,162,39,.14), transparent 70%), #fdfdfb;
      border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); padding: 44px 60px; overflow: hidden;
      display: flex; flex-direction: column; animation: surgir .8s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes surgir { from { opacity: 0; transform: translateY(24px) scale(.98); } }
    /* moldura dupla, verde e dourada */
    .cert::before { content: ""; position: absolute; inset: 16px; border: 3px solid var(--verde-escuro); border-radius: 8px; pointer-events: none; }
    .cert::after { content: ""; position: absolute; inset: 24px; border: 1px solid var(--dourado); border-radius: 4px; pointer-events: none; }
    /* os quadradinhos do gráfico de contribuições, de enfeite no canto */
    .cert-grade { position: absolute; right: 44px; bottom: 112px; display: grid; grid-template-columns: repeat(12, 11px); gap: 4px; opacity: .55; }
    .cert-grade i { width: 11px; height: 11px; border-radius: 2px; }
    .cert-cabecalho { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .cert-cabecalho .logo { height: 78px; }
    .cert-cabecalho .estrela { height: 84px; filter: drop-shadow(0 4px 10px rgba(201,162,39,.4)); }
    .cert-corpo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; z-index: 1; }
    .cert-tipo { font-family: var(--mono); letter-spacing: .3em; font-size: 15px; color: var(--verde-escuro); font-weight: 700; }
    .cert-certificamos { margin-top: 18px; font-size: 17px; color: #4b5563; }
    .cert-nome { font-size: 46px; font-weight: 700; line-height: 1.1; margin-top: 6px; color: #0f2a1a; }
    .cert-login { font-family: var(--mono); font-size: 15px; color: #6b7280; margin-top: 4px; }
    .cert-texto { margin-top: 16px; font-size: 17px; color: #374151; max-width: 720px; line-height: 1.5; }
    .cert-curso { font-size: 30px; font-weight: 700; margin-top: 6px; background: linear-gradient(90deg, var(--verde-escuro), var(--dourado)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .cert-evento { margin-top: 8px; font-size: 16px; color: #374151; max-width: 760px; line-height: 1.45; }
    .cert-evento b { color: #1d4f91; }
    .cert-habilidades { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 16px; max-width: 780px; }
    .cert-habilidades span { font-size: 13px; padding: 4px 11px; border-radius: 999px; background: rgba(26,127,55,.09); border: 1px solid rgba(26,127,55,.25); color: #14532d; }
    .cert-rodape { display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: end; gap: 20px; position: relative; z-index: 1; font-size: 13px; color: #4b5563; }
    .cert-rodape b { color: #111827; }
    .assinatura { text-align: center; }
    /* memoji num círculo, ao lado da assinatura (que fica em cima da linha) */
    .assinatura-topo { position: relative; display: flex; justify-content: center; align-items: flex-end; min-height: 60px; }
    .assinatura .rubrica { height: 64px; max-width: 260px; object-fit: contain; margin-bottom: -6px; }
    .assinatura .memoji {
      height: 52px; width: 52px; border-radius: 50%; object-fit: cover; object-position: top;
      background: radial-gradient(circle at 35% 30%, #c8f2dc, #7ee2b8); box-shadow: 0 0 0 2px #1a7f37, 0 0 0 4px rgba(201,162,39,.6);
    }
    /* com assinatura, o memoji sai do centro e vai para a esquerda dela */
    .assinatura-topo:has(.rubrica) .memoji { position: absolute; left: 0; bottom: 4px; }
    .assinatura .linha { border-top: 1.5px solid #374151; padding-top: 6px; margin-top: 2px; }
    .link-prof { color: #0a66c2; font-size: 12px; text-decoration: none; font-family: var(--mono); }
    .verificado { text-align: right; }
    .verificado .selo { display: inline-block; font-weight: 700; color: var(--verde-escuro); font-size: 14px; }
    .verificado code { font-family: var(--mono); font-size: 12px; color: #374151; }

    /* ---------- ações ---------- */
    .acoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 26px 0 18px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; border: 0; text-decoration: none; transition: transform .2s, box-shadow .3s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-linkedin { background: #0a66c2; color: #fff; box-shadow: 0 10px 26px rgba(10,102,194,.35); }
    .btn-verde { background: linear-gradient(135deg, var(--verde-claro), var(--verde)); color: #04140a; }
    .btn-ghost { background: rgba(255,255,255,.06); border: 1px solid var(--borda); color: var(--texto); }
    .post { max-width: 760px; margin: 0 auto; background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; padding: 18px 20px; }
    .post h3 { font-size: 16px; margin-bottom: 8px; }
    .post p.dica { color: var(--suave); font-size: 13.5px; margin-bottom: 10px; }
    .post pre { white-space: pre-wrap; font-family: var(--sans); font-size: 14.5px; line-height: 1.55; background: #0b1118; border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }

    /* ---------- página "Meus certificados" ---------- */
    .busca { max-width: 760px; margin: 0 auto; text-align: center; }
    .busca h1 { font-size: clamp(30px, 4vw, 46px); margin-bottom: 8px; }
    .busca h1 span { background: linear-gradient(90deg, var(--verde-claro), #e3c26b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .busca p { color: var(--suave); margin-bottom: 18px; }
    .busca form { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .busca input { font: inherit; font-family: var(--mono); padding: 12px 16px; border-radius: 999px; border: 1px solid var(--borda); background: #0b1118; color: var(--texto); min-width: 260px; outline: none; }
    .busca input:focus { border-color: var(--verde); }
    .lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 26px; text-align: left; }
    .item { background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .item.ganho { border-color: rgba(63,185,80,.55); }
    .item .icone { font-size: 30px; }
    .item small { color: var(--suave); }
    .item a { margin-top: 6px; font-weight: 700; }
    /* versão usada só na hora de baixar a imagem */
    .exportando { animation: none !important; }
    .exportando .cert-curso { background: none; -webkit-text-fill-color: #1a7f37; color: #1a7f37; }
    @media (max-width: 1060px) { .cert-moldura { margin: 0 -16px; padding: 0 16px 8px; } }
  </style>
</head>
<body>
  <canvas id="confete" aria-hidden="true"></canvas>
  <header class="topo">
    <img src="assets/estrela.png" alt="">
    <b>GitHub na Prática · Certificados</b>
    <a href="./">← Voltar ao curso</a>
  </header>
  <main id="principal"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script>
  /* ==========================================================
     PARA EDITAR
     ========================================================== */
  const CONFIG = {
    professora: "Profª Maristela Oliveira",
    assinatura: "assets/assinatura.png",   // imagem da assinatura (fundo transparente), ex.: "assets/assinatura.png"
    // nomes que o aluno digita depois do @ para marcar no LinkedIn
    mencaoProfessora: "Maristela Oliveira",
    mencaoFaculdade: "Faculdade Senac DF",
    linkedinProfessora: "https://www.linkedin.com/in/maristelanunesoliveira",
    faculdade: "Faculdade de Tecnologia e Inovação Senac DF",
    linkedinFaculdade: "https://www.linkedin.com/school/faculdadesenacdf/",
    linkedinFaculdadeId: "",      // número da página da faculdade no LinkedIn (liga o certificado à página dela)
    serie: "GitHub na Prática",
    // o evento em que os cursos foram feitos (aparece no certificado; deixe "" para esconder)
    evento: "Workshop GitHub na Prática: Como Transformar Seus Projetos em Portfólio",
    eventoComplemento: "",        // ex.: "Jornada Interdisciplinar 2026" (aparece embaixo do nome do evento)
    endereco: "https://maristelaoliveira.github.io/curso-github/certificado.html",
  };
  // titulo: o da issue que o robô abre (é por ele que a página encontra a conclusão)
  const CURSOS = {
    entrega: { icone: "⭐", nome: "Minha primeira entrega", titulo: "Minha primeira entrega",
      habilidades: ["Repositório a partir de modelo", "README em Markdown", "Página em HTML", "Publicação no GitHub Pages", "Fluxo de entrega de projetos"] },
    vscode: { icone: "💻", nome: "Git no VS Code", titulo: "Git no VS Code",
      habilidades: ["Clone e commits no VS Code", "Push e pull", "Configuração do Git", "Proteção de segredos com .gitignore", "Boas mensagens de commit"] },
    equipe: { icone: "👥", nome: "Trabalho em equipe", titulo: "Trabalho em equipe",
      habilidades: ["Branches", "Pull requests", "Revisão de código", "Resolução de conflitos", "Merge"] },
  };
  const TRILHA = { icone: "🏆", nome: "Trilha completa: do zero ao portfólio",
    habilidades: ["Repositórios e README", "GitHub Pages", "Git no VS Code", "Segurança com .gitignore", "Branches e pull requests", "Revisão de código", "Resolução de conflitos"] };

  /* ==========================================================
     AUXILIARES
     ========================================================== */
  const $ = (s) => document.querySelector(s);
  const escapar = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const loginValido = (l) => /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(l || "");
  const dataBR = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
  let ultimaBusca = 0;
  async function api(url) {
    // a busca do GitHub sem login aceita 10 pedidos por minuto: espaçamos um pouco
    const espera = 700 - (Date.now() - ultimaBusca);
    if (espera > 0) await new Promise((r) => setTimeout(r, espera));
    ultimaBusca = Date.now();
    const r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (r.status === 403 || r.status === 429) throw new Error("O GitHub pediu uma pausa (muitas consultas seguidas). Espere um minuto e recarregue a página.");
    if (!r.ok) throw new Error(`Não consegui consultar o GitHub (erro ${r.status}).`);
    return r.json();
  }

  // procura a issue do curso, aberta pelo robô e concluída, nos repositórios do aluno
  async function conclusao(login, cursoId) {
    const c = CURSOS[cursoId];
    const q = `user:${login} is:issue label:concluido in:title "${c.titulo}"`;
    const dados = await api(`https://api.github.com/search/issues?per_page=10&q=${encodeURIComponent(q)}`);
    const it = dados.items.find((i) => i.user && i.user.login === "github-actions[bot]" && i.title.includes(c.titulo) && i.state === "closed");
    return it ? { data: new Date(it.closed_at), url: it.html_url } : null;
  }

  // código do certificado: 10 letras/números calculados a partir de aluno + curso + data
  async function codigo(login, cursoId, data) {
    const bytes = new TextEncoder().encode(`${login.toLowerCase()}|${cursoId}|${data.toISOString().slice(0, 10)}`);
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return [...new Uint8Array(hash)].slice(0, 5).map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  }

  /* ==========================================================
     PÁGINA DE UM CERTIFICADO
     ========================================================== */
  async function mostrarCertificado(login, cursoId) {
    const principal = $("#principal");
    principal.innerHTML = `<div class="status" id="status"><span class="girando">⏳</span> Conferindo no GitHub se <b>@${escapar(login)}</b> concluiu o curso...</div>`;
    try {
      const ids = cursoId === "trilha" ? Object.keys(CURSOS) : [cursoId];
      const resultados = [];
      for (const id of ids) resultados.push(await conclusao(login, id));
      const faltando = ids.filter((id, i) => !resultados[i]);
      if (faltando.length) {
        $("#status").className = "status erro";
        $("#status").innerHTML = `🔎 Ainda não encontrei a conclusão de <b>@${escapar(login)}</b> em: ${faltando.map((id) => `${CURSOS[id].icone} ${CURSOS[id].nome}`).join(", ")}.
          <br><small>Confira se o repositório do curso é <b>público</b> e se a issue foi fechada como concluída. Depois de concluir, pode levar alguns minutos para o GitHub encontrar.</small>`;
        return;
      }
      const data = new Date(Math.max(...resultados.map((r) => r.data)));
      const curso = cursoId === "trilha" ? TRILHA : CURSOS[cursoId];
      const perfil = await api(`https://api.github.com/users/${login}`).catch(() => ({}));
      const nome = perfil.name || login;
      const cod = await codigo(login, cursoId, data);
      const link = `${CONFIG.endereco}?aluno=${encodeURIComponent(login)}&curso=${cursoId}`;
      const titulo = `${CONFIG.serie}: ${curso.nome}`;

      $("#status").className = "status ok";
      $("#status").innerHTML = `✅ <b>Certificado verificado:</b> conferido agora mesmo no GitHub. ${resultados.map((r, i) => `<a href="${r.url}" target="_blank" rel="noopener">ver ${ids.length > 1 ? CURSOS[ids[i]].nome : "a conclusão"}</a>`).join(" · ")}`;

      const cores = ["#ebedf0", "#9be9a8", "#40c463", "#30a14e", "#216e39"];
      const grade = Array.from({ length: 48 }, (_, i) => `<i style="background:${cores[(i * 7 + login.length) % 5]}"></i>`).join("");
      principal.insertAdjacentHTML("beforeend", `
        <div class="cert-moldura"><div class="cert" id="cert">
          <div class="cert-grade">${grade}</div>
          <div class="cert-cabecalho">
            <a href="${CONFIG.linkedinFaculdade || "#"}" target="_blank" rel="noopener"><img class="logo" src="assets/logo-faculdade.png" alt="${escapar(CONFIG.faculdade)}"></a>
            <img class="estrela" src="assets/estrela.png" alt="">
          </div>
          <div class="cert-corpo">
            <div class="cert-tipo">CERTIFICADO DE CONCLUSÃO</div>
            <div class="cert-certificamos">Certificamos que</div>
            <div class="cert-nome">${escapar(nome)}</div>
            <div class="cert-login">@${escapar(login)} no GitHub</div>
            <div class="cert-texto">${cursoId === "trilha" ? "concluiu os três cursos práticos da trilha" : "concluiu o curso prático"}</div>
            <div class="cert-curso">${curso.icone} ${escapar(curso.nome)}</div>
            ${CONFIG.evento
              ? `<div class="cert-evento">realizado no <b>${escapar(CONFIG.evento)}</b>${CONFIG.eventoComplemento ? `<br>${escapar(CONFIG.eventoComplemento)}` : ""}</div>`
              : `<div class="cert-texto" style="margin-top:4px;font-size:15px">da série <b>${CONFIG.serie}</b></div>`}
            <div class="cert-texto" style="margin-top:2px;font-size:14px;color:#6b7280">Tarefas feitas no GitHub e corrigidas automaticamente.</div>
            <div class="cert-habilidades">${curso.habilidades.map((h) => `<span>${escapar(h)}</span>`).join("")}</div>
          </div>
          <div class="cert-rodape">
            <div>Concluído em<br><b>${dataBR(data)}</b></div>
            <div class="assinatura">
              <div class="assinatura-topo">
                <img class="memoji" src="assets/memoji.png" alt="">
                ${CONFIG.assinatura ? `<img class="rubrica" src="${CONFIG.assinatura}" alt="Assinatura">` : ""}
              </div>
              <div class="linha"><b>${escapar(CONFIG.professora)}</b><br>${escapar(CONFIG.faculdade)}
                ${CONFIG.linkedinProfessora ? `<br><a class="link-prof" href="${CONFIG.linkedinProfessora}" target="_blank" rel="noopener">in/${escapar(CONFIG.linkedinProfessora.split("/in/")[1].replace(/\/$/, ""))}</a>` : ""}</div>
            </div>
            <div class="verificado"><span class="selo">✅ Verificado no GitHub</span><br>Código <code>${cod}</code></div>
          </div>
        </div></div>

        <div class="acoes">
          <a class="btn btn-linkedin" id="btn-perfil" target="_blank" rel="noopener">➕ Adicionar ao perfil do LinkedIn</a>
          <a class="btn btn-linkedin" id="btn-post" target="_blank" rel="noopener">📣 Compartilhar no LinkedIn</a>
          <button class="btn btn-verde" id="btn-baixar">⬇ Baixar imagem</button>
          <button class="btn btn-ghost" id="btn-link">🔗 Copiar link do certificado</button>
        </div>

        <div class="post">
          <h3>✍️ Texto sugerido para a sua postagem</h3>
          <p class="dica">Copie e cole na postagem. Para a marcação funcionar, apague e digite de novo os nomes depois do <b>@</b> (<b>@${escapar(CONFIG.mencaoProfessora)}</b> e <b>@${escapar(CONFIG.mencaoFaculdade)}</b>): o LinkedIn mostra a lista e você escolhe.</p>
          <pre id="texto-post"></pre>
          <button class="btn btn-ghost" id="btn-copiar-texto">📋 Copiar texto</button>
        </div>`);

      // LinkedIn: "adicionar certificado ao perfil" (formulário de Licenças e certificados já preenchido)
      const perfilURL = new URL("https://www.linkedin.com/profile/add");
      perfilURL.search = new URLSearchParams({
        startTask: "CERTIFICATION_NAME", name: titulo,
        ...(CONFIG.linkedinFaculdadeId ? { organizationId: CONFIG.linkedinFaculdadeId } : { organizationName: CONFIG.faculdade }),
        issueYear: data.getFullYear(), issueMonth: data.getMonth() + 1, certUrl: link, certId: cod,
      });
      $("#btn-perfil").href = perfilURL;
      // LinkedIn: compartilhar o link do certificado no feed
      $("#btn-post").href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(link)}`;

      $("#texto-post").textContent =
`🎉 Concluí ${cursoId === "trilha" ? "a trilha completa" : "o curso prático"} "${curso.nome}"${CONFIG.evento ? `, no ${CONFIG.evento}` : `, da série ${CONFIG.serie}`}, com a @${CONFIG.mencaoProfessora}, na @${CONFIG.mencaoFaculdade}!

${cursoId === "trilha" ? "Foram três cursos práticos feitos direto no GitHub, com correção automática a cada passo." : "Todas as tarefas foram feitas direto no GitHub, com correção automática a cada passo."}

O que eu aprendi:
${curso.habilidades.map((h) => `✅ ${h}`).join("\n")}

Certificado verificado: ${link}

#GitHub #Git #Portfolio #Tecnologia #SenacDF`;

      $("#btn-copiar-texto").onclick = () => copiar($("#texto-post").textContent, "Texto copiado! Agora é só colar no LinkedIn.");
      $("#btn-link").onclick = () => copiar(link, "Link do certificado copiado!");
      $("#btn-baixar").onclick = baixarImagem;
      confete(220);
    } catch (e) {
      $("#status").className = "status erro";
      $("#status").textContent = "⚠️ " + e.message;
    }
  }

  async function copiar(texto, aviso) {
    try { await navigator.clipboard.writeText(texto); alerta(aviso); } catch (e) { alerta("Não deu para copiar: selecione e copie manualmente."); }
  }
  function alerta(t) {
    const el = document.createElement("div");
    el.textContent = t;
    el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3fb950;color:#04140a;font-weight:700;padding:10px 18px;border-radius:999px;z-index:60";
    document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
  }

  // transforma o certificado (HTML) numa imagem PNG e baixa
  async function baixarImagem() {
    if (!window.html2canvas) return alerta("Ainda carregando... tente de novo em um instante.");
    const cert = $("#cert");
    const canvas = await html2canvas(cert, {
      scale: 2, backgroundColor: null, useCORS: true,
      // a "foto" é tirada de uma cópia da página: nela, desligamos a animação e o degradê do título
      onclone: (doc) => doc.querySelector("#cert").classList.add("exportando"),
    });
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "certificado-github-na-pratica.png";
    a.click();
  }

  /* ==========================================================
     PÁGINA "MEUS CERTIFICADOS"
     ========================================================== */
  function mostrarBusca() {
    $("#principal").innerHTML = `
      <section class="busca">
        <h1>Meus <span>certificados</span></h1>
        <p>Digite o seu usuário do GitHub para ver os certificados que você já conquistou.</p>
        <form id="form-busca"><input id="campo-login" placeholder="seu-usuario" autocomplete="off" spellcheck="false" aria-label="Usuário do GitHub"><button class="btn btn-verde">Ver certificados</button></form>
        <div class="lista" id="lista"></div>
      </section>`;
    $("#form-busca").onsubmit = async (e) => {
      e.preventDefault();
      const login = $("#campo-login").value.trim().replace(/^@/, "");
      if (!loginValido(login)) return alerta("Usuário inválido.");
      const lista = $("#lista");
      lista.innerHTML = `<div class="item"><span class="girando">⏳</span> Consultando o GitHub...</div>`;
      try {
        const ganhos = {};
        for (const id of Object.keys(CURSOS)) ganhos[id] = await conclusao(login, id);
        const todos = Object.values(ganhos).every(Boolean);
        const cartao = (id, c, ganho) => `<div class="item ${ganho ? "ganho" : ""}"><span class="icone">${c.icone}</span><b>${escapar(c.nome)}</b>
          <small>${ganho ? `Concluído em ${dataBR(ganho.data)}` : "Ainda não concluído"}</small>
          ${ganho ? `<a href="?aluno=${encodeURIComponent(login)}&curso=${id}">Ver certificado →</a>` : ""}</div>`;
        lista.innerHTML = Object.entries(CURSOS).map(([id, c]) => cartao(id, c, ganhos[id])).join("")
          + cartao("trilha", TRILHA, todos ? { data: new Date(Math.max(...Object.values(ganhos).map((g) => g.data))) } : null);
      } catch (err) { lista.innerHTML = `<div class="item">⚠️ ${escapar(err.message)}</div>`; }
    };
  }

  /* ==========================================================
     CONFETE (quando o certificado aparece)
     ========================================================== */
  function confete(qtd) {
    const canvas = $("#confete"), ctx = canvas.getContext("2d");
    canvas.width = innerWidth; canvas.height = innerHeight;
    const cores = ["#3fb950", "#7ee2b8", "#e3c26b", "#a371f7", "#58a6ff", "#ffffff"];
    let pedacos = Array.from({ length: qtd }, (_, i) => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4,
      vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, w: 7 + Math.random() * 7, h: 9 + Math.random() * 9, cor: cores[i % 6], g: Math.random() * 6, vg: (Math.random() - .5) * .3 }));
    (function quadro() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pedacos.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.g += p.vg;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.g); ctx.fillStyle = p.cor; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.g))); ctx.restore(); });
      pedacos = pedacos.filter((p) => p.y < canvas.height + 30);
      if (pedacos.length) requestAnimationFrame(quadro); else ctx.clearRect(0, 0, canvas.width, canvas.height);
    })();
  }

  /* ==========================================================
     INÍCIO: com ?aluno=...&curso=... mostra o certificado; sem isso, a busca
     ========================================================== */
  const params = new URLSearchParams(location.search);
  const aluno = (params.get("aluno") || "").trim();
  const curso = params.get("curso");
  if (loginValido(aluno) && (CURSOS[curso] || curso === "trilha")) mostrarCertificado(aluno, curso);
  else mostrarBusca();
  </script>
</body>
</html>
